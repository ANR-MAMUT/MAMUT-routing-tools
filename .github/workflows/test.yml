name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      # The MAMUT-routing-lib submodule is the library the tools are built
      # against (see [tool.uv.sources] in pyproject.toml), so it must be there
      # before uv resolves anything.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --dev
      - name: Run tests
        run: uv run pytest -q
      - name: CLI smoke
        run: uv run mamut-tools --help
